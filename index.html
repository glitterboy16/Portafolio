<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angel Villorina — Desarrollador Web</title>
    <meta
      name="description"
      content="Portafolio de Angel Villorina, desarrollador de aplicaciones web en Mérida, España."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c1a22'/%3E%3Ctext x='32' y='45' font-family='system-ui' font-size='34' font-weight='700' fill='%23c0a8f0' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap"
    />
    <script>
      // Fija el tema antes del primer pintado para que no haya destello blanco.
      (() => {
        const guardado = localStorage.getItem('tema');
        const preferido = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = guardado || preferido;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
